name: Build and Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate JS from TSV
        run: |
          npm install
          node scripts/generate_js_from_tsv.js

      - name: Download arXiv metadata JS
        run: |
          mkdir -p js
          curl -sSL https://arxiv.org/a/paya_c_1.js -o js/publications.js

      - name: Clone CV repo
        run: git clone https://github.com/CarlosP24/cv.git cv

      - name: Set up Python
        uses: actions/setup-python@v5

      - name: Prepare CV
        shell: bash
        run: |
          cd cv
          python3 -m venv venv
          source venv/bin/activate
          pip install -r requirements.txt
          bash update_cv.sh \
            "https://api.zotero.org/users/13410489/publications/items?format=bibtex" \
            "../js/talks.js" \
            "../js/outreach.js" \
            "../js/funding.js" \
            "../js/awards.js" \
            "Payá, Carlos"
          cd ..
          rm -rf cv/venv

      - name: Cache LaTeX packages
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: apt-texlive-${{ runner.os }}-v2
          restore-keys: |
            apt-texlive-${{ runner.os }}-

      - name: Install LaTeX
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            texlive-luatex texlive-xetex texlive-latex-extra texlive-fonts-extra \
            texlive-bibtex-extra biber latexmk

      - name: Build CV
        working-directory: cv
        run: |
          luaotfload-tool --update
          latexmk -interaction=nonstopmode -lualatex CV.tex
          cp CV.pdf ../files/CV.pdf

      - name: Show LaTeX log on failure
        if: failure()
        run: |
          echo "=== ERRORS IN LOG ==="
          grep -n "^!" cv/CV.log | head -30 || echo "No ! errors found"
          echo "=== BIBER LOG ==="
          cat cv/CV.blg 2>/dev/null | tail -30 || echo "No biber log"
          echo "=== LAST 100 LINES OF CV.log ==="
          tail -100 cv/CV.log

      - name: Commit and push all generated files
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add js/*.js files/CV.pdf
          git diff --cached --quiet || git commit -m "Update generated JS files and CV.pdf [skip ci]"
          git pull --rebase origin main
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4