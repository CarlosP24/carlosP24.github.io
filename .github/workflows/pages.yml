name: Build and Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate JS from TSV
        run: |
          npm install
          node scripts/generate_js_from_tsv.js

      - name: Download arXiv metadata JS
        run: |
          mkdir -p js
          curl -sSL https://arxiv.org/a/paya_c_1.js -o js/publications.js

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Build CV.pdf from website HTML
        run: |
          node scripts/generate_cv_pdf.js
          mkdir -p _site/files
          cp files/CV.pdf _site/files/CV.pdf

      - name: Commit and push all generated files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add js/*.js files/CV.pdf
          git diff --cached --quiet || git commit -m "Update generated JS files and CV.pdf [skip ci]"
          git pull --rebase origin main
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4